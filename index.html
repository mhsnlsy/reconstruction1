<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dikilitaşın Dikilişi — Visuals Rekonstrüksiyonu</title>
<style>
:root{color-scheme:dark;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10171b}
body{display:flex}.app{position:relative;width:100%;height:100%;overflow:hidden}
canvas{display:block;width:100%;height:100%}
.hud{position:absolute;inset:0;pointer-events:none;padding:20px;display:flex;flex-direction:column;justify-content:space-between}
.top{display:flex;justify-content:space-between;gap:14px}.card{background:rgba(12,17,20,.82);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:13px 16px;box-shadow:0 12px 35px rgba(0,0,0,.25)}
.eyebrow{font-size:10px;letter-spacing:.14em;font-weight:800;color:#c9b18e}.title{font-size:20px;font-weight:800;margin-top:4px}.sub{font-size:11px;color:#a9a39b;margin-top:5px}
.status{min-width:190px;text-align:right}.status b{display:block;font-size:13px}.status span{font-size:11px;color:#b7b0a7}
.bottom{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}.controls{display:flex;align-items:center;gap:8px;pointer-events:auto}.btn{border:1px solid rgba(255,255,255,.15);background:rgba(12,17,20,.88);color:#eee;padding:10px 14px;border-radius:10px;font-weight:700;cursor:pointer}.btn:hover{background:#1d272d}.speed{font-size:11px;color:#c8c0b6;background:rgba(12,17,20,.82);padding:9px 12px;border-radius:10px}.speed input{width:90px;vertical-align:middle}
.progress{position:absolute;left:20px;right:20px;bottom:0;height:4px;background:rgba(255,255,255,.13)}.progress i{display:block;height:100%;width:0;background:#c9a77b}
.legend{font-size:10px;line-height:1.5;color:#bbb4aa;max-width:300px;text-align:right}
@media(max-width:600px){.hud{padding:12px}.title{font-size:16px}.sub{font-size:10px}.status{min-width:130px}.legend{display:none}.btn{padding:8px 10px}.speed input{width:65px}}
</style>
</head>
<body>
<div class="app">
<canvas id="scene"></canvas>
<div class="hud">
  <div class="top">
    <div class="card">
      <div class="eyebrow">VISUALS • 3D RECONSTRUCTION</div>
      <div class="title">Dikilitaş nasıl dikildi?</div>
      <div class="sub">Theodosius Dikilitaşı · Hipodrom · kaynak temelli 3B rekonstrüksiyon</div>
    </div>
    <div class="card status">
      <b id="phase">Yatay konum — hazırlık</b>
      <span><span id="time">0.0</span> s · tarihsel kayıt: 30–32 gün</span>
    </div>
  </div>
  <div class="bottom">
    <div class="controls">
      <button class="btn" id="play">▶ Başlat</button>
      <button class="btn" id="reset">↺ Baştan</button>
      <label class="speed">Hız <input id="speed" type="range" min=".5" max="1.5" step=".05" value=".95"><output id="speedValue">0.95×</output></label>
    </div>
    <div class="legend">Model: <b>Visuals / dogancansk-cloud</b><br>Halat ve kaldırma düzeneği: görsel rekonstrüksiyon</div>
  </div>
</div>
<div class="progress"><i id="bar"></i></div>
</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from "three";
import {GLTFLoader} from "three/addons/loaders/GLTFLoader.js";
import {OrbitControls} from "three/addons/controls/OrbitControls.js";

const canvas=document.getElementById("scene");
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:false});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight,false);
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x10171b);
scene.fog=new THREE.Fog(0x10171b,55,125);

const camera=new THREE.OrthographicCamera(-20,20,12,-12,.1,250);
camera.position.set(24,21,24);
camera.lookAt(0,0,4);

const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;controls.enablePan=false;controls.minZoom=0.75;controls.maxZoom=1.5;
controls.minPolarAngle=.45;controls.maxPolarAngle=1.15;
controls.target.set(0,0,4);controls.update();

scene.add(new THREE.HemisphereLight(0xd8d0c4,0x29231e,2.3));
const sun=new THREE.DirectionalLight(0xffe0b7,3.2);sun.position.set(-20,30,18);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);scene.add(sun);
const fill=new THREE.DirectionalLight(0x9db7c9,1.2);fill.position.set(22,15,-18);scene.add(fill);

const ground=new THREE.Mesh(new THREE.PlaneGeometry(100,100),new THREE.MeshStandardMaterial({color:0x625b52,roughness:.92}));
ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);

const grid=new THREE.GridHelper(70,35,0x9b8d7d,0x83776a);grid.position.y=.012;grid.material.opacity=.18;grid.material.transparent=true;scene.add(grid);

function box(w,h,d,x,y,z,mat=0x7b5c43){
 const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({color:mat,roughness:.8}));
 m.position.set(x,y+h/2,z);m.castShadow=true;m.receiveShadow=true;scene.add(m);return m;
}
// Raised timber erection frame
const frameMat=new THREE.MeshStandardMaterial({color:0x6f4930,roughness:.8});
for(const [x,z] of [[-7,-3.5],[-7,3.5],[7,-3.5],[7,3.5]]) box(.55,9,.55,x,0,z,0x68452f);
box(15,.6,.6,0,8.7,-3.5,0x5b3b28);box(15,.6,.6,0,8.7,3.5,0x5b3b28);
box(.45,.45,8,0,6.5,0,0x765137);

const pedestal=box(4.8,.8,3.8,0,0,0,0x9a8570);
box(3.7,.7,2.9,0,.8,0,0xb29c85);
const socket=box(1.05,.18,.65,0,1.5,0,0x403730);

function cylinderBetween(a,b,r,mat){
 const dir=new THREE.Vector3().subVectors(b,a),len=dir.length();
 const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,len,16),new THREE.MeshStandardMaterial({color:mat,roughness:.8}));
 m.position.copy(a).add(b).multiplyScalar(.5);m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),dir.normalize());m.castShadow=true;scene.add(m);return m;
}
// Cross braces
for(const z of [-3.5,3.5]){
 cylinderBetween(new THREE.Vector3(-7,1,z),new THREE.Vector3(7,8.5,z),.12,0x3d2b21);
 cylinderBetween(new THREE.Vector3(7,1,z),new THREE.Vector3(-7,8.5,z),.12,0x3d2b21);
}

// Source-based lifting mechanism:
// The north relief is described as showing the obelisk resting on a wheel,
// with two gangs hauling ropes attached to capstans. We model that mechanism
// explicitly rather than inventing a crane.
function pulley(x,y,z,r=.62){
 const g=new THREE.Group();g.position.set(x,y,z);
 const wheel=new THREE.Mesh(new THREE.CylinderGeometry(r,r,.22,32),
   new THREE.MeshStandardMaterial({color:0x292622,metalness:.4,roughness:.55}));
 wheel.rotation.z=Math.PI/2;wheel.castShadow=true;g.add(wheel);
 const hub=new THREE.Mesh(new THREE.CylinderGeometry(r*.2,r*.2,.3,20),
   new THREE.MeshStandardMaterial({color:0xc3a276,metalness:.35,roughness:.5}));
 hub.rotation.z=Math.PI/2;g.add(hub);scene.add(g);return g;
}

// Two guide pulleys high on the timber frame.
const guideL=pulley(-3.6,8.25,-3.5,.62);
const guideR=pulley(3.6,8.25,-3.5,.62);

// Wheel attached to the foot of the obelisk, matching the relief description.
const footWheel=new THREE.Group();
const fw=new THREE.Mesh(new THREE.CylinderGeometry(.72,.72,.28,32),
  new THREE.MeshStandardMaterial({color:0x40342b,metalness:.2,roughness:.7}));
fw.rotation.z=Math.PI/2;fw.castShadow=true;footWheel.add(fw);
const axle=new THREE.Mesh(new THREE.CylinderGeometry(.14,.14,1.0,20),
  new THREE.MeshStandardMaterial({color:0xb08b61,metalness:.35,roughness:.5}));
axle.rotation.z=Math.PI/2;footWheel.add(axle);
scene.add(footWheel);

// GLB from the Visuals repository — actual Dikilitas model.
const obeliskPivot=new THREE.Group();obeliskPivot.position.set(0,1.58,0);scene.add(obeliskPivot);
const loader=new GLTFLoader();
let obelisk=null, obeliskLength=16;
loader.load("./assets/dikilitas.web.glb",g=>{
 obelisk=g.scene;
 obelisk.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true}});
 const box3=new THREE.Box3().setFromObject(obelisk), size=box3.getSize(new THREE.Vector3()), center=box3.getCenter(new THREE.Vector3());
 obelisk.position.sub(center);
 const s=18/Math.max(size.y,size.x,size.z);obelisk.scale.setScalar(s);
 const b2=new THREE.Box3().setFromObject(obelisk), min=b2.min.y;
 obelisk.position.y-=min;
 obeliskPivot.add(obelisk);
 obeliskLength=Math.max(b2.max.y-b2.min.y,18);
 setAngle(-Math.PI/2);
}, undefined, err=>{
 phase.textContent="Dikilitaş modeli yüklenemedi";
 console.error("Dikilitaş GLB load error",err);
});

function setAngle(a){obeliskPivot.rotation.z=a}

const ropeMat=new THREE.LineBasicMaterial({color:0x241c16,linewidth:4});
function rope(points){
 const g=new THREE.BufferGeometry().setFromPoints(points);
 const l=new THREE.Line(g,ropeMat);scene.add(l);return l;
}
const ropeL=rope([new THREE.Vector3(0,2,0),new THREE.Vector3(-3.6,8.25,-3.5),new THREE.Vector3(-9,2,3)]);
const ropeR=rope([new THREE.Vector3(0,2,0),new THREE.Vector3(3.6,8.25,-3.5),new THREE.Vector3(9,2,3)]);

// Two capstans = two hauling teams.
function makeCapstan(x,z){
 const g=new THREE.Group();g.position.set(x,0,z);scene.add(g);
 const drum=new THREE.Mesh(new THREE.CylinderGeometry(.62,.62,1.15,28),
   new THREE.MeshStandardMaterial({color:0x70472f,roughness:.8}));
 drum.rotation.x=Math.PI/2;drum.position.y=.58;drum.castShadow=true;g.add(drum);
 for(let i=0;i<4;i++){
   const arm=new THREE.Mesh(new THREE.BoxGeometry(2.2,.14,.14),
     new THREE.MeshStandardMaterial({color:0x8e6241,roughness:.8}));
   arm.rotation.y=i*Math.PI/2;arm.position.y=1.25;g.add(arm);
 }
 return g;
}
const capstanL=makeCapstan(-9,3),capstanR=makeCapstan(9,3);

let t=0,running=false,last=performance.now(),duration=13;
const phase=document.getElementById("phase"),timeEl=document.getElementById("time"),bar=document.getElementById("bar");
const speed=document.getElementById("speed");
const ease=x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;
function renderScene(sec){
 const p=Math.min(1,Math.max(0,sec/duration));
 const u=p<.05?0:ease((p-.05)/.95);
 const angle=-Math.PI/2 + u*Math.PI/2;
 setAngle(angle);

 // Wheel follows the foot of the obelisk.
 footWheel.position.copy(obeliskPivot.position);
 footWheel.rotation.z=angle;

 // Rope attachment point at the foot/wheel, then up through the two guides
 // and down to the two capstans.
 const foot=new THREE.Vector3(0,1.62,0);
 obeliskPivot.localToWorld(foot);
 ropeL.geometry.setFromPoints([foot,new THREE.Vector3(-3.6,8.25,-3.5),new THREE.Vector3(-9,2,3)]);
 ropeR.geometry.setFromPoints([foot,new THREE.Vector3(3.6,8.25,-3.5),new THREE.Vector3(9,2,3)]);

 const turns=(u*7.5);
 capstanL.rotation.y=turns;
 capstanR.rotation.y=turns;
 guideL.rotation.x=-turns*.35;
 guideR.rotation.x=-turns*.35;

 phase.textContent=p<.05?"Yatay konum — tekerlek ve halatlar":p<.30?"İki ekip halatları çekiyor":p<.78?"Dikilitaş kaldırılıyor":p<.96?"Kaideye hizalanıyor":"Dikilitaş dikildi";
 timeEl.textContent=sec.toFixed(1);bar.style.width=(p*100)+"%";
}
document.getElementById("play").onclick=()=>{if(t>=duration)t=0;running=!running;document.getElementById("play").textContent=running?"❚❚ Duraklat":"▶ Devam et"};
document.getElementById("reset").onclick=()=>{running=false;t=0;document.getElementById("play").textContent="▶ Başlat";renderScene(0)};
speed.oninput=()=>document.getElementById("speedValue").textContent=Number(speed.value).toFixed(2)+"×";

function loop(now){
 const dt=Math.min(.05,(now-last)/1000);last=now;
 if(running){t+=dt*Number(speed.value);if(t>=duration){t=duration;running=false;document.getElementById("play").textContent="▶ Tekrar oynat"}renderScene(t)}
 controls.update();renderer.render(scene,camera);requestAnimationFrame(loop);
}
function resize(){renderer.setSize(innerWidth,innerHeight,false);const aspect=innerWidth/innerHeight;const h=22,w=h*aspect;camera.left=-w/2;camera.right=w/2;camera.top=h/2;camera.bottom=-h/2;camera.updateProjectionMatrix()}
addEventListener("resize",resize);resize();renderScene(0);requestAnimationFrame(loop);
</script>
</body>
</html>
